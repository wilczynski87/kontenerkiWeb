services:
  kontenerki-web:
    build:
      context: .
      dockerfile: Dockerfile
#    container_name: kontenerki-web
    ports:
      - "${PORT:-80}:80"
    restart: unless-stopped
    # Kotlin/Wasm build in Docker Desktop typically needs >= 4 GB RAM for the builder stage
    deploy:
      resources:
        limits:
          memory: 8G
