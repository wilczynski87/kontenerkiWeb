services:
  kotlin-wasm-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: kotlin-wasm-nginx
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G

  # Optional: requires sibling repo ../kontenerkiApi
  # Start with: docker compose -f docker/docker-compose.yml --profile api up --build
  api:
    profiles: ["api"]
    build:
      context: ../kontenerkiApi
      dockerfile: Dockerfile
    container_name: kontenerkiapi
    restart: unless-stopped
